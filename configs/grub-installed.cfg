# Built into the boot loaders of an installed Kryzen system (UEFI: BOOTX64.EFI,
# legacy BIOS: core.img). GRUB runs this with its minimal start-up parser (no
# "if"), then enters normal mode and reads $prefix/grub.cfg: the boot menu the
# installer stored on the EFI System Partition.
search --no-floppy --file --set=root /EFI/Kryzen/kryzen.marker
set prefix=($root)/EFI/Kryzen/grub
