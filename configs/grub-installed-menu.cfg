# Kryzen OS boot menu of an installed system. Copied by the installer to
# EFI/Kryzen/grub/grub.cfg on the EFI System Partition; the boot loaders
# (UEFI and legacy BIOS) find that partition through EFI/Kryzen/kryzen.marker
# and have every module they need built in.

set default=0
set timeout=5

if loadfont $prefix/themes/kryzen/kryzen-20.pf2 ; then
    loadfont $prefix/themes/kryzen/kryzen-16.pf2
    set gfxmode=1280x720x32,1024x768x32,auto
    terminal_output gfxterm
    set theme=$prefix/themes/kryzen/theme.txt
fi

menuentry "Kryzen Hybrid OS (AI Core + Linux/NT Layers)" --class kryzen {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /EFI/Kryzen/boot/kernel.elf
    boot
}

menuentry "Kryzen OS (Safe Mode & Recovery)" --class recovery {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /EFI/Kryzen/boot/kernel.elf kryzen.mode=safe
    boot
}

menuentry "Kryzen Console (CLI / TTY Mode)" --class tty {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /EFI/Kryzen/boot/kernel.elf kryzen.mode=tty
    boot
}

if [ "${grub_platform}" = "efi" ]; then
    if search --no-floppy --file --set=kz_windows /EFI/Microsoft/Boot/bootmgfw.efi ; then
        menuentry "Windows Boot Manager (Direct Boot)" --class windows {
            set root=$kz_windows
            chainloader /EFI/Microsoft/Boot/bootmgfw.efi
        }
    fi
    menuentry "UEFI Firmware Settings" --class firmware {
        fwsetup
    }
fi
