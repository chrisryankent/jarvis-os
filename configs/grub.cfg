# Kryzen OS boot menu: live / installer media (the menu of an installed
# system is configs/grub-installed-menu.cfg).

set default=0
set timeout=5

# Graphical menu with the Kryzen theme; falls back to the plain text menu if
# the fonts or the video mode are unavailable.
insmod all_video
insmod gfxterm
insmod png
insmod jpeg
if loadfont /boot/grub/themes/kryzen/kryzen-20.pf2 ; then
    loadfont /boot/grub/themes/kryzen/kryzen-16.pf2
    set gfxmode=1280x720x32,1024x768x32,auto
    terminal_output gfxterm
    set theme=/boot/grub/themes/kryzen/theme.txt
fi

menuentry "Kryzen Hybrid OS (AI Core + Linux/NT Layers)" --class kryzen {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "Install Kryzen OS on this computer" --class install {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /boot/kernel.elf kryzen.mode=installer
    module2 /boot/kernel.elf kryzen-kernel
    module2 /boot/kryzen-boot.tar kryzen-boot
    boot
}

menuentry "Kryzen OS (Safe Mode & Recovery)" --class recovery {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /boot/kernel.elf kryzen.mode=safe
    boot
}

menuentry "Kryzen Console (CLI / TTY Mode)" --class tty {
    set gfxpayload=1280x720x32,1024x768x32
    multiboot2 /boot/kernel.elf kryzen.mode=tty
    boot
}

# Shown only where they exist: another system's boot manager, and the
# firmware's own setup screen.
if [ "${grub_platform}" = "efi" ]; then
    insmod chain
    if search --no-floppy --file --set=kz_windows /EFI/Microsoft/Boot/bootmgfw.efi ; then
        menuentry "Windows Boot Manager (Direct Boot)" --class windows {
            set root=$kz_windows
            chainloader /EFI/Microsoft/Boot/bootmgfw.efi
        }
    fi
    menuentry "UEFI Firmware Settings" --class firmware {
        fwsetup
    }
fi
