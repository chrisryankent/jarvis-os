set default=0
set timeout=10

menuentry "CK OS (Default)" {
    multiboot2 /boot/kernel.elf quiet splash
    boot
}

menuentry "CK OS (Debug)" {
    multiboot2 /boot/kernel.elf jarvis.log_level=debug
    boot
}

menuentry "CK OS (Safe)" {
    multiboot2 /boot/kernel.elf jarvis.safe_mode=1
    boot
}

menuentry "Recovery Shell" {
    multiboot2 /boot/kernel.elf jarvis.recovery=1 init=/bin/bash
    boot
}

menuentry "System Info" {
    clear
    echo "CK Operating System v1.0"
    echo "Architecture: x86-64"
    echo "AI Engine: LLaMA Inference"
    echo "Voice: Whisper STT + Neural TTS"
    echo "Security: Mandatory Access Control"
    echo ""
    echo "Features:"
    echo "- Natural Language Voice Commands"
    echo "- Offline AI Processing"
    echo "- Advanced Window Manager"
    echo "- Real-time Security Audit"
    echo ""
    read
}
