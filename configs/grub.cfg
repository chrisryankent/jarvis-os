# JARVIS OS boot menu

set default=0
set timeout=5

# Graphical menu with the JARVIS theme; falls back to the plain text menu if
# the font or video mode is unavailable.
insmod all_video
insmod gfxterm
insmod png
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768x32,auto
    terminal_output gfxterm
    set theme=/boot/grub/themes/jarvis/theme.txt
fi

menuentry "JARVIS OS" {
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "Restart" {
    reboot
}

menuentry "Shut down" {
    halt
}
